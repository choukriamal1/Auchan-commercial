<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Beldi Market</title>
        <meta name="theme-color" content="#733e0a">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        
        <link rel="icon" type="image/svg+xml" href="icons/favicon .png">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <style type="text/tailwindcss">
        
        
        </style>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body class="flex min-h-screen flex-col bg-slate-100 text-slate-800 ">
        <header class="sticky top-0 z-50 flex items-center justify-between gap-4 border-b border-slate-300 bg-slate-200 px-4 py-3 shadow-md shadow-md">
                            
                    <a href="index.html" class="flex min-w-0 items-center ">
                     <img src="icons/nom+logo.jpg" alt="logo_img" class="h-12 w-auto max-w-full rounded-2xl sm:h-14" >
                    </a> 

                    <button type="button" id="cart-btn" aria-label="Ouvrir le panier" class="relative cursor-pointer">
                    <img src="icons/panier.png" class="h-10 w-auto sm:h-12">
                    <span id="card-count" class=""absolute -top-2 -right-2 flex h-6 min-w-6 items-center justify-center rounded-full bg-coral px-1 text-xs font-bold text-white>0</span>
                    </button>
            
        </header>
        
        <main class="mx-auto w-full max-w-7xl flex-1 space-y-8 p-4 sm:p-8">
                
            <div class="grid items-center gap-6  bg-[#0d163e] rounded-2xl shadow p-6 md:grid-cols-3 lg:p-8 ">
                    <img src="icons/dis.jpg" class="rounded-2xl h-55 w-100 md:block hidden">
                    
                    <div class="flex flex-col items-center text-center gap-2 ">
                            <small class="text-[#FF6467] text-lg text-coral font-bold sm:text-xl">Sélection de la semaine</small>
                            <h1 class="text-white font-bold text-3xl">Des prix qui font plaisir.</h1>
                            <p class="text-white/90">Jusquà -30% sur une sélection dessentiels, seulement pour quelques jours.</small>
                    </div>
                    
                    <img src="icons/teroire (1).png"  class="mx-auto max-h-64 w-auto ">
                
            </div> 

            <section class="">
            <div>
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute top-1/2 left-4 -translate-y-1/2 text-slate-400"></i>
                    <input id="search" type="search" placeholder="Rechercher un produit..."
                           class="pr-4 pl-10 w-full rounded-full border border-slate-300 bg-white py-2 ">
                </div>
            </div>
            
            <div id="filters" class="flex flex-wrap gap-3 mt-4 py-4 ">
                <button type="button" class="bg-white rounded-4xl text-slate-800 font-semibold px-5 py-2 cursor-pointer hover:bg-[#FF6467]">Tout</button>
                <button type="button" class="rounded-4xl text-slate-800 bg-white font-semibold px-5 py-2 cursor-pointer hover:bg-[#FF6467]">Alimentation</button>
                <button type="button" class="rounded-4xl text-slate-800  bg-white font-semibold px-5 py-2 cursor-pointer hover:bg-[#FF6467]">Instruments</button>
                <button type="button" class="rounded-4xl text-slate-800  bg-white font-semibold px-5 py-2 cursor-pointer hover:bg-[#FF6467]">Flowers</button>
                <button type="button" class="rounded-4xl text-slate-800  bg-white font-semibold px-5 py-2 cursor-pointer hover:bg-[#FF6467]">Games</button>
            </div>
            </div>

            

            <section id="catalogue" class="grid grid-col-1 gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
                <div class="  from-amber-100 ">
                <p class="text-lg  my-4 uppercase text-gray-400 font-sans  ">Catalogue Produits</p>
                <h1 class="font-sans font-bold text-2xl text-slate-800 py-2 ">12 produits</h1>
            </div>
            </section>
            </section>
        </main>
        
        
        <footer class= "bg-[#020618] text-amber-50">
            <div class="flex flex-col items-center gap-4 px-4 py-6 md:flex-row md:justify-center mx-auto max-w-6xl">
                <p class="text-sm ">&copy; 2026 MAGASINE. Tous droits réservés</p>
            </div>
        </footer>
        <script type="module" src="js/main.js"></script>
    </body>
</htm>
